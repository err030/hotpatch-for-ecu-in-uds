<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#fffaf3" />
<text x="60" y="60" font-size="34" font-weight="700" fill="#202020">Hotpatch Evaluation For UDS-on-CAN</text>
<text x="60" y="96" font-size="20" fill="#454545">software-level assessment of exposure reduction, attack blocking, resource usage and timing overhead</text>

<text x="60" y="150" font-size="26" font-weight="700" fill="#202020">Cumulative Exposure Window</text>
<rect x="60" y="180" width="420" height="38" rx="12" fill="#f4a261" /><text x="72" y="170" font-size="18" fill="#202020">OTA-only</text><text x="490" y="210" font-size="18" fill="#202020">6605 min</text>
<rect x="60" y="250" width="177" height="38" rx="12" fill="#2a9d8f" /><text x="72" y="240" font-size="18" fill="#202020">Hotpatch-first</text><text x="247" y="280" font-size="18" fill="#202020">2787 min</text>

<text x="60" y="360" font-size="26" font-weight="700" fill="#202020">Attack Block Rate In OTA Window</text>
<rect x="60" y="390" width="392" height="38" rx="12" fill="#2a9d8f" /><text x="72" y="380" font-size="18" fill="#202020">Hotpatch block rate</text><text x="462" y="420" font-size="18" fill="#202020">93.55%</text>
<rect x="60" y="460" width="13" height="38" rx="12" fill="#e76f51" /><text x="72" y="450" font-size="18" fill="#202020">OTA-only block rate</text><text x="83" y="490" font-size="18" fill="#202020">3.23%</text>

<text x="640" y="150" font-size="26" font-weight="700" fill="#202020">Resource And Real-Time Notes</text>
<text x="640" y="180" font-size="20" fill="#202020">Reserved memory: 672 B</text><text x="640" y="214" font-size="20" fill="#202020">Peak quarantine: 64 B</text><text x="640" y="248" font-size="20" fill="#202020">Peak active code: 64 B</text><text x="640" y="282" font-size="20" fill="#202020">Validation+scheduling+apply: 1.460 ms</text><text x="640" y="316" font-size="20" fill="#202020">Guard overhead: 0.050 ms</text><text x="640" y="350" font-size="20" fill="#202020">Attack chain latency vulnerable/patched: 3.350 / 3.500 ms</text><text x="640" y="384" font-size="20" fill="#202020">Exposure reduction ratio: 0.578</text>

<rect x="640" y="470" width="470" height="180" rx="18" fill="#f1f5f9" stroke="#d6dce4" />
<text x="665" y="510" font-size="22" font-weight="700" fill="#202020">Interpretation</text>
<text x="665" y="548" font-size="19" fill="#202020">Hotpatch-first shrinks the exposure window before full OTA completion.</text>
<text x="665" y="580" font-size="19" fill="#202020">The software model shows a modest latency increase but earlier blocking.</text>
<text x="665" y="612" font-size="19" fill="#202020">This is evidence for thesis-level plausibility, not hardware proof.</text>
</svg>
